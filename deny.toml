# cargo-deny — supply-chain gate: advisories, licenses, crate bans, and source registries.
# Run: cargo deny --all-features check advisories licenses bans sources

[graph]
all-features = true

[bans]
# AGENTS §13: banned/hallucinated crates must fail the gate.
deny = [
    "genomicframe-core",
    "rustalign-simd",
    "ksw2rs",
    "seqair",
    "cyanea-align",
]

[advisories]
version = 2
# Unmaintained crates are advisory noise for an application workspace; surface
# them without failing the gate until replacements are chosen.
unmaintained = "workspace"
yanked = "warn"

[licenses]
version = 2
# Allow-list mirrors what Cargo.lock actually resolves to (noodles/bio/rayon/
# clap/statrs family). Re-run `cargo deny check licenses` after adding deps.
allow = [
    "MIT",
    "Apache-2.0",
    "Unicode-3.0",
    "Zlib",
    "bzip2-1.0.6",
    "GPL-2.0-or-later",
]
confidence-threshold = 0.8
# profiling-only: optional dep of vardictrust feature profile-cpu/profile-heap; never in the release graph
exceptions = [
    { allow = ["CDDL-1.0"], crate = "inferno" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
