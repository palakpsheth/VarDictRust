# Upstream provenance manifest for VarDictRust (AGENTS.md §5):
# - `[vardictjava]`, `[vardict_scripts]`, and `[advisory_comparators.vardictcpp]` pin the
#   immutable default `--compat=vardictjava` (`--parity`) differential oracle and third-arm comparator.
# - `[compat_off_and_cli_lineage]` records external community PRs, issues, forks, and peer-reviewed
#   datasets informing opt-in `--compat=off` (`CompatProfile`) switches and CLI ergonomics.

[vardictjava]
repository = "https://github.com/AstraZeneca-NGS/VarDictJava"
version = "1.8.3"
commit = "0886261"
license = "MIT"

[vardict_scripts]
repository = "https://github.com/AstraZeneca-NGS/VarDict"
submodule_path = "VarDictJava/VarDict"
commit = "009e017"
scripts = ["var2vcf_valid.pl", "var2vcf_paired.pl", "teststrandbias.R", "testsomatic.R"]

[ported_libraries.htsjdk]
artifact = "com.github.samtools:htsjdk"
version = "2.21.0"
ported_components = ["Cigar", "SAMRecord", "SequenceUtil"]
license = "MIT"

[ported_libraries.commons_math3]
artifact = "org.apache.commons:commons-math3"
version = "3.6.1"
ported_components = ["HypergeometricDistribution", "SaddlePointExpansion"]
license = "Apache-2.0"

[mathematical_references.loader_2000]
module = "crates/vardictrust-core/src/stats/hypergeom.rs"
citations = [
    "Catherine Loader (2000), Fast and Accurate Computation of Binomial Probabilities, HP Laboratories",
    "Euler-Maclaurin Bernoulli Stirling remainder series",
    "Abramowitz & Stegun (1964) §26.1.21 hypergeometric tail recurrence",
    "Richard Brent (1973) zeroin root-finding",
]

[advisory_comparators.vardictcpp]
package = "vardictcpp"
version = "3"
bioconda_build = "hc52dbad_0"
role = "advisory-throughput-comparator-only"

