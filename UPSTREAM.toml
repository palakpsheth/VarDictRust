[vardictjava]
repository = "https://github.com/AstraZeneca-NGS/VarDictJava"
version = "1.8.3"
commit = "0886261"
license = "MIT"

[vardict_scripts]
repository = "https://github.com/AstraZeneca-NGS/VarDict"
