[workspace]
members = ["crates/vardictrust-core", "crates/vardictrust"]
resolver = "2"

[workspace.package]
version = "1.0.4"
edition = "2021"
rust-version = "1.86.0"
license = "MIT AND GPL-2.0-or-later"
repository = "https://github.com/palakpsheth/VarDictRust"
authors = ["Palak Sheth <palakpsheth@gmail.com>"]
readme = "README.md"
description = "Fast, memory-safe, idiomatic Rust rewrite of VarDictJava v1.8.3"
keywords = ["bioinformatics", "genomics", "variant-caller", "ngs", "somatic"]
categories = ["science::bioinformatics", "command-line-utilities"]

[workspace.dependencies]
anyhow = "1"
thiserror = "2"
clap = { version = "4", features = ["derive"] }
rayon = "1"
indexmap = "2"
rustc-hash = "1.1"
tikv-jemallocator = "0.7"
noodles = { version = "0.117", default-features = false, features = ["bam","cram","sam","fasta","vcf","bgzf","csi","tabix","core","bed"] }
noodles-bgzf = { version = "0.52.0", features = ["libdeflate"] }
fishers_exact = "1"
log = "0.4"
env_logger = "0.11"
regex = "1"
tempfile = "3"
criterion = "0.8"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "fat"

# Profiling profile: optimizes like release, keeps debug symbols for symbolization,
# and unwinds on panic so Session::drop runs on panic.
[profile.profiling]
inherits = "release"
strip = false
debug = 1
panic = "unwind"
