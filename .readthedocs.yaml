# .readthedocs.yaml — ReadTheDocs build configuration for VarDictRust
# Reference: https://docs.readthedocs.io/en/stable/config-file/v2.html

version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.12"
  commands:
    - python3 -m venv "${READTHEDOCS_VIRTUALENV_PATH:-.venv_rtd}"
    - "${READTHEDOCS_VIRTUALENV_PATH:-.venv_rtd}/bin/python" -m pip install --upgrade pip
    - "${READTHEDOCS_VIRTUALENV_PATH:-.venv_rtd}/bin/python" -m pip install -r docs/requirements.txt
    - "${READTHEDOCS_VIRTUALENV_PATH:-.venv_rtd}/bin/python" harness/prepare_docs_site.py
    - "${READTHEDOCS_VIRTUALENV_PATH:-.venv_rtd}/bin/zensical" build --clean --strict
    - mkdir -p "$READTHEDOCS_OUTPUT/html"
    - cp -a site/. "$READTHEDOCS_OUTPUT/html/"

