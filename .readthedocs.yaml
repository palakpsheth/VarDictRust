# .readthedocs.yaml — ReadTheDocs build configuration for VarDictRust
# Reference: https://docs.readthedocs.io/en/stable/config-file/v2.html

version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.12"
  jobs:
    post_install:
      # Stage repository markdown files into .docs_staged preserving directory structure
      - python3 harness/prepare_docs_site.py

mkdocs:
  configuration: mkdocs.yml

python:
  install:
    - requirements: docs/requirements.txt
