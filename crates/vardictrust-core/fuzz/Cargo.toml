[package]
name = "vardictrust-core-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

# Standalone workspace so main Cargo.lock and cargo-deny (libfuzzer-sys NCSA license) stay untouched.
[workspace]

# Pre-existing fuzz_targets/* style; kept at crate level to avoid unrelated diffs.
[lints.clippy]
field_reassign_with_default = "allow"
manual_flatten = "allow"
unnecessary_mut_passed = "allow"

[dependencies]
libfuzzer-sys = "0.4"
noodles = { version = "0.119", features = ["bam", "cram", "sam", "fasta", "bgzf", "csi", "core"] }
noodles-bgzf = "0.52.0"
tempfile = "3"
vardictrust-core = { path = ".." }

[[bin]]
name = "fuzz_modify_cigar"
path = "fuzz_targets/fuzz_modify_cigar.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_realign"
path = "fuzz_targets/fuzz_realign.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_bed_parser"
path = "fuzz_targets/fuzz_bed_parser.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_sam_aux"
path = "fuzz_targets/fuzz_sam_aux.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_parse_and_realign"
path = "fuzz_targets/fuzz_parse_and_realign.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_vcf_streamer"
path = "fuzz_targets/fuzz_vcf_streamer.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_cram_and_fai"
path = "fuzz_targets/fuzz_cram_and_fai.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_somatic_fisher_and_amplicon"
path = "fuzz_targets/fuzz_somatic_fisher_and_amplicon.rs"
test = false
doc = false
bench = false
