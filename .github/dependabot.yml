version: 2
updates:
  # Maintain Rust dependencies in Cargo.toml / Cargo.lock
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "monthly"
      day: "monday"
      time: "04:00"
      timezone: "America/Los_Angeles"
    open-pull-requests-limit: 5
    allow:
      - dependency-type: "all"
    # Group dependencies to minimize PR fatigue while separating genomic core from tooling
    groups:
      genomic-dependencies:
        patterns:
          - "noodles*"
          - "fishers_exact*"
          - "rustc-hash*"
      tooling-dependencies:
        patterns:
          - "clap*"
          - "rayon*"
          - "anyhow*"
          - "thiserror*"
          - "log*"
          - "env_logger*"
          - "regex*"
          - "tempfile*"
          - "criterion*"
          - "indexmap*"
          - "tikv-jemallocator*"
          - "pprof*"
          - "inferno*"
          - "dhat*"
          - "jemalloc_pprof*"
          - "libc*"
      transitive-dependencies:
        patterns:
          - "*"
        exclude-patterns:
          - "noodles*"
          - "fishers_exact*"
          - "rustc-hash*"
          - "clap*"
          - "rayon*"
          - "anyhow*"
          - "thiserror*"
          - "log*"
          - "env_logger*"
          - "regex*"
          - "tempfile*"
          - "criterion*"
          - "indexmap*"
          - "tikv-jemallocator*"
          - "pprof*"
          - "inferno*"
          - "dhat*"
          - "jemalloc_pprof*"
          - "libc*"

  # Maintain GitHub Actions workflows
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
      day: "monday"
      time: "04:00"
      timezone: "America/Los_Angeles"
    open-pull-requests-limit: 5
    groups:
      actions:
        patterns:
          - "*"

  # Maintain Python documentation dependencies in docs/requirements.txt
  - package-ecosystem: "pip"
    directory: "/docs"
    schedule:
      interval: "monthly"
      day: "monday"
      time: "06:00"
      timezone: "UTC"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "docs"
    commit-message:
      prefix: "chore(deps)"
    groups:
      docs-dependencies:
        patterns:
          - "*"
