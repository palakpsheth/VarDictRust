version: 2
updates:
  # Maintain Rust dependencies in Cargo.toml / Cargo.lock
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "monthly"
      day: "monday"
      time: "04:00"
      timezone: "America/Los_Angeles"
    open-pull-requests-limit: 5
    # Group dependencies to minimize PR fatigue while separating genomic core from tooling
    groups:
      genomic-dependencies:
        patterns:
          - "noodles*"
          - "bio*"
          - "statrs*"
          - "fishers_exact*"
      tooling-dependencies:
        patterns:
          - "clap*"
          - "rayon*"
          - "anyhow*"
          - "thiserror*"
          - "log*"
          - "env_logger*"
          - "regex*"
          - "tempfile*"
          - "criterion*"
          - "indexmap*"

  # Maintain GitHub Actions workflows
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
      day: "monday"
      time: "04:00"
      timezone: "America/Los_Angeles"
    open-pull-requests-limit: 5
    groups:
      actions:
        patterns:
          - "*"
