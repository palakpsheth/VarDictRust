          parts = jwt_val.split(".")
          if len(parts) != 3:
              print("ERROR: Invalid OIDC JWT returned by Actions token endpoint!", file=sys.stderr)
              sys.exit(1)
          payload_b64 = parts[1] + "=" * (-len(parts[1]) % 4)
          claims = json.loads(base64.urlsafe_b64decode(payload_b64).decode("utf-8"))
          server_url = os.environ.get("GITHUB_SERVER_URL", "https://github.com").rstrip("/")
          repo = str(claims["repository"])
          wf_ref = str(claims["workflow_ref"])
          wf_path = wf_ref.removesuffix(f"@{claims['ref']}").removeprefix(f"{repo}/")
          ext_params = {
              "workflow": {
                  "ref": str(claims["ref"]),
                  "repository": f"{server_url}/{repo}",
                  "path": wf_path,
              }
          }
          expected_tag = os.environ.get("EXPECTED_TAG", "")
          if str(claims["event_name"]) == "workflow_dispatch" and expected_tag:
              ext_params["inputs"] = {"tag": expected_tag}
          expected_ref = os.environ.get("EXPECTED_REF", "")
          expected_commit = os.environ.get("EXPECTED_COMMIT", "")
          # GitHub's POST /repos/{owner}/{repo}/attestations validator enforces that
          # resolvedDependencies[0] matches externalParameters.workflow (Fulcio cert ref/sha).
          resolved_deps = [
              {
                  "uri": f"git+{server_url}/{repo}@{claims['ref']}",
                  "digest": {"gitCommit": str(claims["sha"])},
              }
          ]
          if expected_ref and expected_commit and (str(claims["ref"]) != expected_ref or str(claims["sha"]) != expected_commit):
              resolved_deps.append(
                  {
                      "uri": f"git+{server_url}/{repo}@{expected_ref}",
                      "digest": {"gitCommit": expected_commit},
                  }
              )
          predicate = {
              "buildDefinition": {
                  "buildType": "https://actions.github.io/buildtypes/workflow/v1",
                  "externalParameters": ext_params,
                  "internalParameters": {
                      "github": {
                          "event_name": str(claims["event_name"]),
                          "repository_id": str(claims["repository_id"]),
                          "repository_owner_id": str(claims["repository_owner_id"]),
                          "runner_environment": str(claims["runner_environment"]),
                      }
                  },
                  "resolvedDependencies": resolved_deps,
              },
              "runDetails": {
                  "builder": {
                      "id": f"{server_url}/{claims['job_workflow_ref']}",
                  },
                  "metadata": {
                      "invocationId": f"{server_url}/{repo}/actions/runs/{claims['run_id']}/attempts/{claims['run_attempt']}",
                  },
              },
          }
          pathlib.Path(os.environ["PREDICATE_OUT"]).write_text(json.dumps(predicate), encoding="utf-8")
          PY
      - id: attest
        name: Attest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: "target/distrib/*${{ join(matrix.targets, ', ') }}*"
          predicate-type: "https://slsa.dev/provenance/v1"
          predicate-path: "${{ runner.temp }}/slsa-predicate.json"
      - name: Verify Signed Attestation Bundle
        if: ${{ needs.plan.outputs.publishing == 'true' }}
        shell: bash
        env:
          BUNDLE_PATH: ${{ steps.attest.outputs.bundle-path }}
          EXPECTED_REF: ${{ needs.plan.outputs.checkout-ref }}
          EXPECTED_COMMIT: ${{ needs.plan.outputs.release-commit }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, json, os, pathlib, sys
          bundle_path = pathlib.Path(os.environ["BUNDLE_PATH"])
          lines = [ln for ln in bundle_path.read_text(encoding="utf-8").splitlines() if ln.strip()]
          if not lines:
              print("ERROR: Signed attestation bundle file is empty!", file=sys.stderr)
              sys.exit(1)
          server_url = os.environ.get("GITHUB_SERVER_URL", "https://github.com").rstrip("/")
          repo = os.environ["GITHUB_REPOSITORY"]
          workflow_uri = f"git+{server_url}/{repo}@{os.environ['GITHUB_REF']}"
          workflow_sha = os.environ["GITHUB_SHA"]
          expected_uri = f"git+{server_url}/{repo}@{os.environ['EXPECTED_REF']}"
          expected_commit = os.environ["EXPECTED_COMMIT"]
          for ln in lines:
              bundle = json.loads(ln)
              stmt = json.loads(base64.b64decode(bundle["dsseEnvelope"]["payload"]).decode("utf-8"))
              if stmt.get("predicateType") != "https://slsa.dev/provenance/v1":
                  print(f"ERROR: Unexpected predicateType: {stmt.get('predicateType')}", file=sys.stderr)
                  sys.exit(1)
              deps = ((stmt.get("predicate") or {}).get("buildDefinition") or {}).get("resolvedDependencies") or []
              if not deps or deps[0].get("uri") != workflow_uri or (deps[0].get("digest") or {}).get("gitCommit") != workflow_sha:
                  print(f"ERROR: Signed attestation resolvedDependencies[0] must match workflow {workflow_uri} @ {workflow_sha}: {deps}", file=sys.stderr)
                  sys.exit(1)
              if not any(d.get("uri") == expected_uri and (d.get("digest") or {}).get("gitCommit") == expected_commit for d in deps):
                  print(f"ERROR: Signed attestation missing release-source dependency {expected_uri} @ {expected_commit}: {deps}", file=sys.stderr)
                  sys.exit(1)
          print(f"[Attestation Guard] Verified signed SLSA provenance records {expected_uri} @ {expected_commit}")
          PY
      - id: cargo-dist
        name: Post-build
        # We force bash here just because github makes it really hard to get values up
        # to "real" actions without writing to env-vars, and writing to env-vars has
        # inconsistent syntax between shell and powershell.
        shell: bash
        run: |
          # Parse out what we just built and upload it to scratch storage
          echo "paths<<EOF" >> "$GITHUB_OUTPUT"
          dist print-upload-files-from-manifest --manifest dist-manifest.json >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

          cp dist-manifest.json "$BUILD_MANIFEST_NAME"
      - name: "Upload artifacts"
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: artifacts-build-local-${{ join(matrix.targets, '_') }}
          path: |
            ${{ steps.cargo-dist.outputs.paths }}
            ${{ env.BUILD_MANIFEST_NAME }}

  # Build and package all the platform-agnostic(ish) things
  build-global-artifacts:
    needs:
      - plan
      - build-local-artifacts
    runs-on: "ubuntu-22.04"
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      BUILD_MANIFEST_NAME: target/distrib/global-dist-manifest.json
    steps:
      - name: Harden GitHub Actions Runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.checkout-ref }}
          persist-credentials: false
          submodules: recursive
      - name: Verify Exact Tag Checkout Commit
        if: ${{ needs.plan.outputs.publishing == 'true' }}
        shell: bash
        env:
          EXPECTED_COMMIT: ${{ needs.plan.outputs.release-commit }}
        run: |
          set -euo pipefail
          ACTUAL_COMMIT="$(git rev-parse HEAD)"
          if [ "$ACTUAL_COMMIT" != "$EXPECTED_COMMIT" ]; then
            echo "ERROR: Checkout commit ${ACTUAL_COMMIT} != expected tag commit ${EXPECTED_COMMIT}!" >&2
            exit 1
          fi
      - name: Install cached dist
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: cargo-dist-cache
          path: ~/.cargo/bin/
      - run: chmod +x ~/.cargo/bin/dist
      # Get all the local artifacts for the global tasks to use (for e.g. checksums)
      - name: Fetch local artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: artifacts-*
          path: target/distrib/
          merge-multiple: true
      - id: cargo-dist
        shell: bash
        run: |
          dist build ${{ needs.plan.outputs.tag-flag }} --output-format=json "--artifacts=global" > dist-manifest.json
          echo "dist ran successfully"

          # Parse out what we just built and upload it to scratch storage
          echo "paths<<EOF" >> "$GITHUB_OUTPUT"
          jq --raw-output ".upload_files[]" dist-manifest.json >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

          cp dist-manifest.json "$BUILD_MANIFEST_NAME"
      - name: "Upload artifacts"
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: artifacts-build-global
          path: |
            ${{ steps.cargo-dist.outputs.paths }}
            ${{ env.BUILD_MANIFEST_NAME }}
  # Determines if we should publish/announce
  host:
    needs:
      - plan
      - build-local-artifacts
      - build-global-artifacts
    # Only run if we're "publishing", and only if plan, local and global didn't fail (skipped is fine)
    if: ${{ always() && needs.plan.result == 'success' && needs.plan.outputs.publishing == 'true' && (needs.build-global-artifacts.result == 'skipped' || needs.build-global-artifacts.result == 'success') && (needs.build-local-artifacts.result == 'skipped' || needs.build-local-artifacts.result == 'success') }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    permissions:
      "contents": "write"
    runs-on: "ubuntu-22.04"
    outputs:
      val: ${{ steps.host.outputs.manifest }}
    steps:
      - name: Harden GitHub Actions Runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.checkout-ref }}
          persist-credentials: false
          submodules: recursive
      - name: Verify Exact Tag Checkout Commit
        if: ${{ needs.plan.outputs.publishing == 'true' }}
        shell: bash
        env:
          EXPECTED_COMMIT: ${{ needs.plan.outputs.release-commit }}
        run: |
          set -euo pipefail
          ACTUAL_COMMIT="$(git rev-parse HEAD)"
          if [ "$ACTUAL_COMMIT" != "$EXPECTED_COMMIT" ]; then
            echo "ERROR: Checkout commit ${ACTUAL_COMMIT} != expected tag commit ${EXPECTED_COMMIT}!" >&2
            exit 1
          fi
      - name: Install cached dist
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: cargo-dist-cache
          path: ~/.cargo/bin/
      - run: chmod +x ~/.cargo/bin/dist
      # Fetch artifacts from scratch-storage
      - name: Fetch artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: artifacts-*
          path: target/distrib/
          merge-multiple: true
      - id: host
        shell: bash
        run: |
          dist host ${{ needs.plan.outputs.tag-flag }} --steps=upload --steps=release --output-format=json > dist-manifest.json
          echo "artifacts uploaded and released successfully"
          cat dist-manifest.json
          echo "manifest=$(jq -c "." dist-manifest.json)" >> "$GITHUB_OUTPUT"
      - name: "Upload dist-manifest.json"
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          # Overwrite the previous copy
          name: artifacts-dist-manifest
          path: dist-manifest.json
      # Create a GitHub Release while uploading all files to it
      - name: "Download GitHub Artifacts"
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: artifacts-*
          path: artifacts
          merge-multiple: true
      - name: Cleanup
        run: |
          # Remove the granular manifests
          rm -f artifacts/*-dist-manifest.json
      - name: Create GitHub Release
        env:
          PRERELEASE_FLAG: "${{ fromJson(steps.host.outputs.manifest).announcement_is_prerelease && '--prerelease' || '' }}"
          ANNOUNCEMENT_TITLE: "${{ fromJson(steps.host.outputs.manifest).announcement_title }}"
          ANNOUNCEMENT_BODY: "${{ fromJson(steps.host.outputs.manifest).announcement_github_body }}"
          RELEASE_COMMIT: "${{ needs.plan.outputs.release-commit }}"
          RELEASE_TAG: "${{ needs.plan.outputs.tag }}"
        run: |
          # Write and read notes from a file to avoid quoting breaking things
          echo "$ANNOUNCEMENT_BODY" > $RUNNER_TEMP/notes.txt

          gh release create "$RELEASE_TAG" --target "$RELEASE_COMMIT" $PRERELEASE_FLAG --title "$ANNOUNCEMENT_TITLE" --notes-file "$RUNNER_TEMP/notes.txt" artifacts/*

  publish-crates:
    name: Publish to Crates.io
    needs:
      - plan
      - host
    if: ${{ always() && needs.host.result == 'success' && needs.plan.outputs.publishing == 'true' && !fromJson(needs.host.outputs.val).announcement_is_prerelease }}
    runs-on: "ubuntu-22.04"
    steps:
      - name: Harden GitHub Actions Runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.checkout-ref }}
          persist-credentials: false
          submodules: recursive
      - name: Verify Exact Tag Checkout Commit
        if: ${{ needs.plan.outputs.publishing == 'true' }}
        shell: bash
        env:
          EXPECTED_COMMIT: ${{ needs.plan.outputs.release-commit }}
        run: |
          set -euo pipefail
          ACTUAL_COMMIT="$(git rev-parse HEAD)"
          if [ "$ACTUAL_COMMIT" != "$EXPECTED_COMMIT" ]; then
            echo "ERROR: Checkout commit ${ACTUAL_COMMIT} != expected tag commit ${EXPECTED_COMMIT}!" >&2
            exit 1
          fi
      - name: Verify preinstalled Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v cargo >/dev/null 2>&1 || ! command -v rustc >/dev/null 2>&1; then
            echo "ERROR: Preinstalled Rust toolchain (cargo/rustc) missing on runner!" >&2
            exit 1
          fi
          rustc --version
          cargo --version
      - name: Publish vardictrust-core to Crates.io
        shell: bash
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
          RELEASE_TAG: ${{ needs.plan.outputs.tag }}
        run: |
          set -euo pipefail
          EXPECTED_VER="${RELEASE_TAG#v}"
          VER_ESC="${EXPECTED_VER//./\\.}"
          err_log="$(mktemp)"
          trap 'rm -f "$err_log"' EXIT
          if cargo publish -p vardictrust-core 2>"$err_log"; then
            cat "$err_log" >&2
            echo "vardictrust-core ${EXPECTED_VER} published successfully"
            exit 0
          fi
          cat "$err_log" >&2
          if grep -Eq "crate version \`${VER_ESC}\` is already uploaded|crate \`?vardictrust-core@${VER_ESC}\`? (is already uploaded|already exists on)" "$err_log"; then
            echo "vardictrust-core ${EXPECTED_VER} is already uploaded on crates.io; treating as idempotent success"
            exit 0
          fi
          echo "ERROR: cargo publish -p vardictrust-core failed" >&2
          exit 1
      - name: Publish vardictrust to Crates.io
        shell: bash
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
          RELEASE_TAG: ${{ needs.plan.outputs.tag }}
        run: |
          set -euo pipefail
          EXPECTED_VER="${RELEASE_TAG#v}"
          VER_ESC="${EXPECTED_VER//./\\.}"
          err_log="$(mktemp)"
          trap 'rm -f "$err_log"' EXIT
          for i in {1..30}; do
            if cargo publish -p vardictrust 2>"$err_log"; then
              cat "$err_log" >&2
              echo "vardictrust ${EXPECTED_VER} published successfully"
              exit 0
            fi
            cat "$err_log" >&2
            if grep -Eq "crate version \`${VER_ESC}\` is already uploaded|crate \`?vardictrust@${VER_ESC}\`? (is already uploaded|already exists on)" "$err_log"; then
              echo "vardictrust ${EXPECTED_VER} is already uploaded on crates.io; treating as idempotent success"
              exit 0
            fi
            if grep -Eq "no matching package named \`vardictrust-core\`|failed to select a version for the requirement \`vardictrust-core" "$err_log"; then
              echo "Waiting for vardictrust-core ${EXPECTED_VER} to propagate on crates.io (attempt $i/30)..."
              sleep 10
              continue
            fi
            echo "ERROR: cargo publish -p vardictrust failed with non-retryable error" >&2
            exit 1
          done
          echo "Failed to publish vardictrust after 30 propagation retries" >&2
          exit 1

