            python3 harness/perf_budget.py hg008-tier2 seqc2-exome-tier2 hg002-tier2 amplicon-tier2 hg008-cram-twin
            {
              echo "tag=${TARGET_TAG}"
              echo "tag_flag=--tag=${TARGET_TAG}"
              echo "checkout_ref=refs/tags/${TARGET_TAG}"
              echo "release_commit=${TAG_COMMIT}"
            } >> "$GITHUB_OUTPUT"
