            echo "## VarDictRust Release Certification Guard"
            echo "- **Ref**: \`${REF_NAME}\` (\`event=${EVENT_NAME}\`, \`pull_request=${IS_PR}\`)"
            echo "- **Consistency & Evidence Check**: \`PASS\`"
