        name: Verify Two-Tier Release Consistency & Certification Guard
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          WORKFLOW_REF: ${{ github.ref }}
          PR_HEAD_REF: ${{ github.head_ref }}
          REF_NAME: ${{ github.ref_name }}
          DISPATCH_TAG: ${{ inputs.tag }}
          IS_PR: ${{ github.event.pull_request != null }}
        run: |
          set -euo pipefail
          echo "[$(date '+%H:%M:%S')] [Release Guard] Verifying release consistency and evidence certification..."
          if [ "$IS_PR" = "true" ]; then
            EXTRA_FLAGS=()
            if [[ "${PR_HEAD_REF:-}" == release/* ]]; then
              EXTRA_FLAGS+=(--require-head-fingerprint)
            fi
            python3 .agents/skills/vardictrust-release/scripts/check_release_consistency.py --phase pre-tag "${EXTRA_FLAGS[@]}"
            {
              echo "tag="
              echo "tag_flag="
              echo "checkout_ref="
              echo "release_commit="
