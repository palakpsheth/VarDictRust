              ;;
          esac
          cache_dir="$HOME/.cache/cargo-dist"
          mkdir -p "$cache_dir" "$HOME/.cargo/bin"
          archive_path="$cache_dir/$archive"
          if [ ! -f "$archive_path" ]; then
            url="https://github.com/axodotdev/cargo-dist/releases/download/${DIST_VERSION}/${archive}"
            curl --proto '=https' --tlsv1.2 -LsSf --retry 5 --retry-delay 5 -o "${archive_path}.part" "$url"
