  plan:
    runs-on: "ubuntu-22.04"
    outputs:
      val: ${{ steps.plan.outputs.manifest }}
      tag: ${{ steps.guard.outputs.tag }}
      tag-flag: ${{ steps.guard.outputs.tag_flag }}
      checkout-ref: ${{ steps.guard.outputs.checkout_ref }}
      release-commit: ${{ steps.guard.outputs.release_commit }}
      publishing: ${{ !github.event.pull_request }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
