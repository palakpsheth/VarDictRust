name: Release
on:
  push:
    tags: ['v*']

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl
      - name: Install musl-tools
        run: sudo apt-get install -y musl-tools
      - name: Build static binary
        run: cargo build --release --target x86_64-unknown-linux-musl
      - name: Smoke gate (micro fixture vs golden)
        run: VARDICT_BIN=target/x86_64-unknown-linux-musl/release/vardictrust bash harness/smoke.sh
      - name: Create release archive
        if: success()
        run: |
          mkdir -p dist
          cp target/x86_64-unknown-linux-musl/release/vardictrust dist/
          cd dist && tar czf vardictrust-x86_64-unknown-linux-musl.tar.gz vardictrust
      - name: GitHub Release
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.tar.gz
