name: CI
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Harden GitHub Actions Runner
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.10.4
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          components: rustfmt, clippy
      - name: Install System Dependencies (samtools)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends samtools
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings -A clippy::needless_late_init -A clippy::byte_char_slices
      - name: Test
        run: cargo test --all
      - name: Bench compile
        run: cargo bench --no-run
      - name: Build release
        run: cargo build --release
      - name: Integration Corpus Regression (91 PASS / 1 XFAIL)
        run: |
          bash harness/run_integration.sh 2>&1 | tee integration.log
          grep -qx 'PASS: 91  XFAIL: 1  FAIL: 0  SKIP: 0  XPASS: 0' integration.log
          grep -qxF 'XFAIL: Simple;hard_clip_case.fa;hard_clip_next_to_del_test2.bam;test;6434-6564;-f 0.0 -p -r 1.txt (UB-4 upstream fixture defect)' integration.log
      - name: Crash Robustness Suite
        run: cargo test -p vardictrust --test robustness

