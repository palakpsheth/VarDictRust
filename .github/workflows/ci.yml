name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: "${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}"
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"
  RUST_TEST_THREADS: "2"
  RAYON_NUM_THREADS: "2"
  RUST_THREADS: "1"

jobs:
  build-and-test:
    name: Build, Unit, Integration, Parity & Coverage Gate
    runs-on: ubuntu-latest
    steps:
      - name: Harden GitHub Actions Runner
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.10.4
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          components: rustfmt, clippy, llvm-tools-preview
      - name: Cache Rust Workspace
        uses: Swatinem/rust-cache@2634bbce9b8fb2cfa56c6fb22cdeed4d8f24fa13 # v2.7.8
      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@ab6895351a88b908e96a4697860d4ffea5e57dbe # v2.49.18
        with:
          tool: cargo-llvm-cov
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Materialize Reference FASTAs
        run: python3 harness/convert_fastas.py
      - name: 1. Format & Lint Gate (rustfmt & clippy)
        id: fmt-lint
        run: |
          t0=$SECONDS
          echo "[$(date '+%H:%M:%S')] [Step 1/9] Running cargo fmt --check, cargo clippy -D warnings, and bench compile..."
          cargo fmt --all -- --check
          cargo clippy --all-targets --all-features -- -D warnings -A clippy::needless_late_init -A clippy::byte_char_slices
          cargo bench --no-run
          echo "STEP1_S=$((SECONDS - t0))" >> "$GITHUB_ENV"
          echo "STEP1_STATUS=PASS" >> "$GITHUB_ENV"
      - name: 2. Build Instrumented Workspace & Test Targets
        id: build
        run: |
          t0=$SECONDS
          echo "[$(date '+%H:%M:%S')] [Step 2/9] Compiling instrumented workspace and all test binaries once..."
          cargo llvm-cov clean --workspace
          cargo llvm-cov --no-report --workspace --bins --tests -- --list >/dev/null
          echo "STEP2_S=$((SECONDS - t0))" >> "$GITHUB_ENV"
          echo "STEP2_STATUS=PASS" >> "$GITHUB_ENV"
      - name: 3. Unit Tests (vardictrust-core & vardictrust)
        id: unit-tests
        run: |
          t0=$SECONDS
          echo "[$(date '+%H:%M:%S')] [Step 3/9] Running unit tests (252 vardictrust-core --lib + 17 vardictrust --bins)..."
          cargo llvm-cov --no-report --no-clean --workspace --lib --bins -- --test-threads=2
          echo "STEP3_S=$((SECONDS - t0))" >> "$GITHUB_ENV"
          echo "STEP3_STATUS=PASS" >> "$GITHUB_ENV"
      - name: 4. Integration & Hostile-Input Tests (Modes, Filters, CRAM & Bounded Memory)
        id: integration-tests
        run: |
          t0=$SECONDS
          echo "[$(date '+%H:%M:%S')] [Step 4/9] Running integration and hostile-input test suites..."
          cargo llvm-cov --no-report --no-clean -p vardictrust-core --test engine_behavior --test amplicon_stream_mem --test cram_stack -- --test-threads=2
          cargo llvm-cov --no-report --no-clean -p vardictrust --test robustness --test profile_smoke --test version --test thread_determinism -- --test-threads=2
          echo "STEP4_S=$((SECONDS - t0))" >> "$GITHUB_ENV"
          echo "STEP4_STATUS=PASS" >> "$GITHUB_ENV"
      - name: 5. Corpus & Modality Parity Tests (110 Golden & Modality Cases)
        id: parity-tests
        run: |
          t0=$SECONDS
          echo "[$(date '+%H:%M:%S')] [Step 5/9] Running 110 in-process golden corpus and modality parity tests..."
          cargo llvm-cov --no-report --no-clean -p vardictrust-core --test corpus_parity -- --test-threads=2
          echo "STEP5_S=$((SECONDS - t0))" >> "$GITHUB_ENV"
          echo "STEP5_STATUS=PASS" >> "$GITHUB_ENV"
      - name: 6. Code Coverage Gate (cargo-llvm-cov >= 90% Lines)
        id: coverage-gate
        run: |
          t0=$SECONDS
          echo "[$(date '+%H:%M:%S')] [Step 6/9] Generating aggregated coverage report and enforcing >= 90% line coverage..."
          cargo llvm-cov report --ignore-filename-regex '(^|/)tests/' --fail-under-lines 90 | tee /tmp/llvm_cov_summary.txt
          echo "STEP6_S=$((SECONDS - t0))" >> "$GITHUB_ENV"
          echo "STEP6_STATUS=PASS" >> "$GITHUB_ENV"
      - name: 7. Harness Diagnostic Self-Tests (Zero-Conda Suites)
        id: self-tests
        run: |
          t0=$SECONDS
          echo "[$(date '+%H:%M:%S')] [Step 7/9] Running zero-conda Python/shell harness diagnostic self-tests..."
          TMP_GS=$(mktemp -d)
          trap 'rm -rf "$TMP_GS"' EXIT
          for py_test in \
            harness/tests/test_bioconda_recipe.py \
            harness/tests/test_compare_vcf.py \
            harness/tests/test_docs_ui.py \
            harness/tests/test_golden_store.py \
            harness/tests/test_profile_catalog.py \
            harness/tests/test_select_slice_regions.py \
            harness/tests/test_stdlib_purity.py; do
            GOLDEN_STORE_DIR="$TMP_GS" python3 "$py_test"
          done
          for sh_test in \
            harness/tests/test_concordance_sv.sh \
            harness/tests/test_courtesy.sh \
            harness/tests/test_env_pinned.sh \
            harness/tests/test_evidence.sh \
            harness/tests/test_fetch_data.sh \
            harness/tests/test_git_hooks.sh \
            harness/tests/test_golden_wiring.sh \
            harness/tests/test_perf_budget.sh \
            harness/tests/test_profile_sh.sh \
            harness/tests/test_release_deps.sh \
            harness/tests/test_scale_bench.sh \
            harness/tests/test_seqc2_align.sh; do
            GOLDEN_STORE_DIR="$TMP_GS" bash "$sh_test"
          done
          echo "STEP7_S=$((SECONDS - t0))" >> "$GITHUB_ENV"
          echo "STEP7_STATUS=PASS" >> "$GITHUB_ENV"
      - name: 8. Release Consistency, Performance Budget & Cleanliness Gate
        id: governance-gate
        env:
          PR_HEAD_REF: ${{ github.head_ref }}
        run: |
          t0=$SECONDS
          echo "[$(date '+%H:%M:%S')] [Step 8/9] Verifying release consistency, 4-target perf budget, and working-tree cleanliness..."
          EXTRA_REL_FLAGS=()
          if [[ "${PR_HEAD_REF:-}" == release/* ]]; then
            EXTRA_REL_FLAGS+=(--require-head-fingerprint)
          fi
          python3 .agents/skills/vardictrust-release/scripts/check_release_consistency.py --phase pre-tag "${EXTRA_REL_FLAGS[@]}"
          python3 harness/perf_budget.py hg008-tier2 seqc2-exome-tier2 hg002-tier2 amplicon-tier2
          dirty=$(git status --porcelain --ignore-submodules=untracked)
          if [ -n "$dirty" ]; then
            echo "ERROR: Working tree dirty after CI run:" >&2
            echo "$dirty" >&2
            exit 1
          fi
          echo "STEP8_S=$((SECONDS - t0))" >> "$GITHUB_ENV"
          echo "STEP8_STATUS=PASS" >> "$GITHUB_ENV"
      - name: 9. Publish CI Telemetry Summary
        if: always()
        run: |
          {
            echo "## VarDictRust Multi-Step CI Pipeline Summary (Tier A)"
            echo ""
            echo "| Step | Gate | Verdict | Elapsed |"
            echo "| :--- | :--- | :---: | :---: |"
            echo "| **1** | Format & Lint Gate (\`rustfmt\` & \`clippy -D warnings\`) | \`${STEP1_STATUS:-FAIL}\` | \`${STEP1_S:-0}s\` |"
            echo "| **2** | Build Instrumented Workspace & Test Targets | \`${STEP2_STATUS:-FAIL}\` | \`${STEP2_S:-0}s\` |"
            echo "| **3** | Unit Tests (\`252 vardictrust-core\` + \`17 vardictrust\`) | \`${STEP3_STATUS:-FAIL}\` | \`${STEP3_S:-0}s\` |"
            echo "| **4** | Integration & Hostile-Input Tests (\`37\` tests) | \`${STEP4_STATUS:-FAIL}\` | \`${STEP4_S:-0}s\` |"
            echo "| **5** | Corpus & Modality Parity Tests (\`110\` cases) | \`${STEP5_STATUS:-FAIL}\` | \`${STEP5_S:-0}s\` |"
            echo "| **6** | Code Coverage Gate (\`cargo-llvm-cov >= 90%\` Lines) | \`${STEP6_STATUS:-FAIL}\` | \`${STEP6_S:-0}s\` |"
            echo "| **7** | Harness Diagnostic Self-Tests (Zero-Conda Suites) | \`${STEP7_STATUS:-FAIL}\` | \`${STEP7_S:-0}s\` |"
            echo "| **8** | Release Consistency, Perf Budget & Cleanliness Gate | \`${STEP8_STATUS:-FAIL}\` | \`${STEP8_S:-0}s\` |"
            if [ -f /tmp/llvm_cov_summary.txt ]; then
              echo ""
              echo "### Rust Workspace Coverage (\`cargo-llvm-cov\`)"
              echo '```text'
              tail -n 20 /tmp/llvm_cov_summary.txt
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
