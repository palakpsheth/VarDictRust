name: CI
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Harden GitHub Actions Runner
        uses: step-security/harden-runner@4d991eb9b905fa189e4c3761ab6a70e20e5a49b4 # v2.11.0
        with:
          egress-policy: audit
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Test
        run: cargo test --all
      - name: Bench compile
        run: cargo bench --no-run
      - name: Build release
        run: cargo build --release
      - name: Integration Corpus Regression
        run: |
          bash harness/run_integration.sh > integration.log 2>&1 || true
          grep -qx 'PASS: 91  FAIL: 1  SKIP: 0' integration.log
          grep -qxF 'MISMATCH: Simple;hard_clip_case.fa;hard_clip_next_to_del_test2.bam;test;6434-6564;-f 0.0 -p -r 1.txt' integration.log
      - name: Crash Robustness Suite
        run: cargo test -p vardictrust --test robustness

