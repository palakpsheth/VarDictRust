name: Differential Testing
on:
  pull_request:
  # Nightly cron disabled until real fixtures exist; re-enable with:
  #   schedule:
  #     - cron: '0 4 * * *'
jobs:
  differential:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
      - uses: conda-incubator/setup-miniconda@be893c923ea9cf1cf7cd510fbdde27c7e18cbdcb # v3.1.1
        with:
          auto-activate-base: true
      - name: Setup oracle
        run: bash harness/setup_oracle.sh
      - name: Build release
        run: cargo build --release
