name: Differential Testing
on:
  pull_request:
  # Nightly cron disabled until real fixtures exist; re-enable with:
  #   schedule:
  #     - cron: '0 4 * * *'
jobs:
  differential:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          submodules: true
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
      - uses: conda-incubator/setup-miniconda@fc2d68f6413eb2d87b895e92f8584b5b94a10167 # v3.1.1
        with:
          auto-activate-base: true
      - name: Setup oracle
        run: bash harness/setup_oracle.sh
      - name: Build release
        run: cargo build --release
