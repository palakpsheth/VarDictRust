name: Documentation Site Gate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: "${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}"
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  build-docs:
    name: MkDocs Strict Build Gate
    runs-on: ubuntu-latest
    steps:
      - name: Harden GitHub Actions Runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: "docs/requirements.txt"

      - name: Install Zensical & Playwright Dependencies
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install -r docs/requirements.txt playwright==1.62.0
          python3 -m playwright install --with-deps chromium

      - name: "[Docs Stage 1/3] Stage Documentation Site"
        run: |
          echo "[$(date '+%H:%M:%S')] [Docs Stage 1/3] Staging documentation site..."
          python3 harness/prepare_docs_site.py

      - name: "[Docs Stage 2/3] Build Documentation site with Zensical (--strict)"
        run: |
          echo "[$(date '+%H:%M:%S')] [Docs Stage 2/3] Building Zensical site with --clean --strict..."
          zensical build --clean --strict

      - name: "[Docs Stage 3/3] Verify Documentation & UI Integrity"
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "[$(date '+%H:%M:%S')] [Docs Stage 3/3] Running test_docs_ui.py (built site + Playwright)..."
          VARDICTRUST_REQUIRE_BUILT_SITE=1 VARDICTRUST_REQUIRE_PLAYWRIGHT=1 python3 harness/tests/test_docs_ui.py
          rm -rf .docs_staged site .cache
          if [ -n "$(git status --porcelain)" ]; then
            echo "ERROR: Documentation gate left dirty working tree:" >&2
            git status --porcelain >&2
            exit 1
          fi

      - name: Publish Documentation Gate Summary
        if: always()
        run: |
          {
            echo "## VarDictRust Documentation Site Gate Summary"
            echo "- **Stage 1**: \`prepare_docs_site.py\`"
            echo "- **Stage 2**: \`zensical build --clean --strict\`"
            echo "- **Stage 3**: \`test_docs_ui.py\` (built site + Playwright)"
          } >> "$GITHUB_STEP_SUMMARY"
