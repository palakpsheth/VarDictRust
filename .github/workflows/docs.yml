name: Documentation Site Gate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-docs:
    name: MkDocs Strict Build Gate
    runs-on: ubuntu-latest
    steps:
      - name: Harden GitHub Actions Runner
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.10.4
        with:
          egress-policy: audit

      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install MkDocs Dependencies
        run: pip install -r docs/requirements.txt

      - name: "[Docs Stage 1/3] Stage Documentation Site"
        run: |
          echo "[$(date '+%H:%M:%S')] [Docs Stage 1/3] Staging documentation site..."
          python3 harness/prepare_docs_site.py

      - name: "[Docs Stage 2/3] Build Documentation (--strict)"
        run: |
          echo "[$(date '+%H:%M:%S')] [Docs Stage 2/3] Building MkDocs site with --strict..."
          mkdocs build --strict

      - name: "[Docs Stage 3/3] Verify Documentation & UI Integrity"
        run: |
          echo "[$(date '+%H:%M:%S')] [Docs Stage 3/3] Running test_docs_ui.py..."
          python3 harness/tests/test_docs_ui.py

      - name: Publish Documentation Gate Summary
        if: always()
        run: |
          {
            echo "## VarDictRust Documentation Site Gate Summary"
            echo "- **Stage 1**: \`prepare_docs_site.py\`"
            echo "- **Stage 2**: \`mkdocs build --strict\`"
            echo "- **Stage 3**: \`test_docs_ui.py\`"
          } >> "$GITHUB_STEP_SUMMARY"
