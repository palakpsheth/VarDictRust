name: Security Audits & Supply Chain

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 6 * * 1'  # weekly Monday 6am UTC
  workflow_dispatch:

concurrency:
  group: "${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}"
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read
  security-events: write

jobs:
  security-scan:
    name: Security & Supply-Chain Scan
    runs-on: ubuntu-latest
    steps:
      - name: Harden GitHub Actions Runner
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.10.4
        with:
          egress-policy: audit

      - name: Checkout Repository (Full History)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # Full commit history required for Gitleaks range analysis

      - name: Secret Scanning (Gitleaks)
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Pre-Built Security Tools
        uses: taiki-e/install-action@ab6895351a88b908e96a4697860d4ffea5e57dbe # v2.49.18
        with:
          tool: cargo-deny,cargo-audit,clippy-sarif,sarif-fmt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Supply-Chain Advisory & License Compliance (cargo-deny)
        run: |
          echo "[$(date '+%H:%M:%S')] [Security Stage 2/4] Running cargo-deny check..."
          cargo deny check advisories licenses bans

      - name: RustSec Vulnerability Database Audit (cargo-audit)
        run: |
          echo "[$(date '+%H:%M:%S')] [Security Stage 3/4] Running cargo-audit..."
          cargo audit

      - name: Rust Code Scanning (Clippy SARIF)
        run: |
          echo "[$(date '+%H:%M:%S')] [Security Stage 4/4] Running Clippy SARIF scan..."
          cargo clippy --all-targets --all-features --message-format=json | clippy-sarif | tee clippy-results.sarif | sarif-fmt
        continue-on-error: true

      - name: Upload SARIF to GitHub Code Scanning
        uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          sarif_file: clippy-results.sarif
          category: clippy
        if: always()

      - name: Publish Security Audit Summary
        if: always()
        run: |
          {
            echo "## VarDictRust Security & Supply-Chain Summary"
            echo ""
            echo "| Stage | Scanner | Status |"
            echo "| :--- | :--- | :---: |"
            echo "| **Stage 1** | Gitleaks Secret Scan | \`COMPLETED\` |"
            echo "| **Stage 2** | \`cargo-deny\` (Advisories, Licenses, Bans) | \`COMPLETED\` |"
            echo "| **Stage 3** | \`cargo-audit\` (RustSec DB) | \`COMPLETED\` |"
            echo "| **Stage 4** | Clippy SARIF Code Scanning | \`COMPLETED\` |"
          } >> "$GITHUB_STEP_SUMMARY"
