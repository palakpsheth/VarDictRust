name: Security Audits & Supply Chain

on:
  push:
    branches: [main, release/*]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 6 * * 1'  # weekly Monday 6am UTC

permissions:
  contents: read

jobs:
  security-scan:
    name: Security & Supply-Chain Scan
    runs-on: ubuntu-latest
    steps:
      - name: Harden GitHub Actions Runner
        uses: step-security/harden-runner@4d991eb9b905fa189e4c3761ab6a70e20e5a49b4 # v2.11.0
        with:
          egress-policy: audit

      - name: Checkout Repository (Full History)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0 # Full commit history required for Gitleaks range analysis

      - name: Secret Scanning (Gitleaks)
        uses: gitleaks/gitleaks-action@e9f8a32ab637a89eb0e47854618e77a2842c8d21 # v2.3.8
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Pre-Built Security Tools (cargo-deny & cargo-audit)
        uses: taiki-e/install-action@b73273e936b801a6b0be649f8244249a039fc7c0 # v2.49.18
        with:
          tool: cargo-deny,cargo-audit
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Supply-Chain Advisory & License Compliance (cargo-deny)
        run: cargo deny check advisories licenses

      - name: RustSec Vulnerability Database Audit (cargo-audit)
        run: cargo audit
