name: Feature Request / Candidate Fix Proposal
description: Propose a CompatProfile correctness fix under --compat=off (v1.1+) or an opt-in feature per ROADMAP.md.
title: "[Proposal]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Please consult [`ROADMAP.md`](https://github.com/palakpsheth/VarDictRust/blob/main/ROADMAP.md) before submitting. Default invocations (`--compat=vardictjava` / `--parity`) preserve 100% VarDictJava v1.8.3 parity; output-changing corrections to upstream VarDictJava bugs ship as `CompatProfile` switches under opt-in `--compat=off` (`##VarDictRustCompat=off`, zero per-bug `--fix` CLI flags) with strict diff-confinement gates.
  - type: textarea
    id: problem
    attributes:
      label: Problem Statement / Upstream Bug
      description: What upstream behavior or limitation is being addressed? Cite upstream issue number if applicable.
      placeholder: e.g. Upstream issue #92 (VD > DP depth calculation)...
    validations:
      required: true
  - type: textarea
    id: proposed_solution
    attributes:
      label: Proposed Solution / --compat=off Behavior
      description: Describe the proposed `CompatProfile` switch behavior under `--compat=off` (or opt-in feature flag) and expected output differences versus `--compat=vardictjava`.
    validations:
      required: true
  - type: textarea
    id: validation_plan
    attributes:
      label: Empirical Validation Strategy
      description: How will this change be verified without affecting unaffected variants?
    validations:
      required: true
