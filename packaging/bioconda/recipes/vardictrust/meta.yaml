{% set name = "vardictrust" %}
{% set version = "1.1.0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://github.com/palakpsheth/VarDictRust/archive/refs/tags/v{{ version }}.tar.gz
  sha256: c38fa31f2c2c33b16eef91e2a6f5b096a302498acbb8dbc04a58c6cb726fb7e9

build:
  number: 0
  binary_relocation: false
  run_exports:
    - {{ pin_subpackage(name, max_pin="x") }}

requirements:
  build:
    - {{ compiler('c') }}
    - {{ stdlib('c') }}
    - {{ compiler('rust') }}
    - make
    - cargo-bundle-licenses

test:
  commands:
    - vardictrust --version
    - vardictrust --help

about:
  home: https://github.com/palakpsheth/VarDictRust
  license: MIT
  license_family: MIT
  license_file:
    - LICENSE
    - LICENSE-3RD-PARTY
    - THIRDPARTY.yml
  summary: "Fast Rust somatic & germline variant caller - drop-in VarDictJava with fixes"
  description: |
    VarDictRust is a fast, memory-safe Rust somatic and germline variant caller
    that consolidates the VarDictJava v1.8.3 + R + Perl pipeline into a single
    MIT-licensed binary with bounded-memory WGS tiling, default byte-identical
    VarDictJava v1.8.3 parity on valid inputs (--compat=vardictjava), native
    multithreaded BGZF and Tabix/CSI VCF output, opt-in --compat=off correctness,
    SV, and SAM =/X (--eqx) alignment fixes (32 switches), clinical workflow
    presets (--preset wgs|wes|amplicon|ctdna), --amplicon-single-primer support,
    and 18/18 var2vcf post-filtering including --vcf-all-alleles multi-allelic
    VCF output.
  doc_url: https://vardictrust.readthedocs.io/
  dev_url: https://github.com/palakpsheth/VarDictRust

extra:
  additional-platforms:
    - linux-aarch64
    - osx-arm64
  recipe-maintainers:
    - palakpsheth
  identifiers:
    - doi:10.1093/nar/gkw227
    - biotools:vardictrust
