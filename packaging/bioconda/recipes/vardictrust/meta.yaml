{% set name = "vardictrust" %}
{% set version = "1.0.10" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://github.com/palakpsheth/VarDictRust/archive/refs/tags/v{{ version }}.tar.gz
  sha256: e7c0daf0c7df4c540296252fabce792f5ca5c72b9bc0517c4d7874a737c81b94

build:
  number: 0
  binary_relocation: false
  run_exports:
    - {{ pin_subpackage(name, max_pin="x") }}

requirements:
  build:
    - {{ compiler('c') }}
    - {{ stdlib('c') }}
    - {{ compiler('rust') }}
    - make
    - cargo-bundle-licenses

test:
  commands:
    - vardictrust --version
    - vardictrust --help

about:
  home: https://github.com/palakpsheth/VarDictRust
  license: MIT AND GPL-2.0-or-later
  license_family: GPL2
  license_file:
    - LICENSE
    - LICENSE-3RD-PARTY
    - THIRDPARTY.yml
  summary: "Fast, memory-safe Rust variant caller (VarDictJava parity; v1.1+ --compat=off)"
  description: |
    VarDictRust is a fast, memory-safe Rust somatic and germline variant caller
    that consolidates the VarDictJava v1.8.3 + R + Perl pipeline into a single
    binary with bounded-memory WGS tiling, default byte-identical VarDictJava
    v1.8.3 parity on valid inputs (v1.0.10 default; --compat=vardictjava in
    v1.1.0+), native multithreaded BGZF and Tabix/CSI VCF output, and (in
    v1.1.0+) opt-in --compat=off correctness, SV, and SAM =/X (--eqx) alignment
    fixes (13 switches) plus 18/18 var2vcf post-filtering including
    --vcf-all-alleles multi-allelic VCF output.
  doc_url: https://vardictrust.readthedocs.io/
  dev_url: https://github.com/palakpsheth/VarDictRust

extra:
  additional-platforms:
    - linux-aarch64
    - osx-arm64
  recipe-maintainers:
    - palakpsheth
  identifiers:
    - doi:10.1093/nar/gkw227
    - biotools:vardictrust
