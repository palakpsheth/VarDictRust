# zensical.toml — Zensical documentation site configuration for VarDictRust
# Built after staging repository Markdown via `python3 harness/prepare_docs_site.py`.

[project]
site_name = "VarDictRust"
site_description = "Fast Rust somatic & germline variant caller — drop-in VarDictJava with fixes"
site_author = "Palak Sheth"
site_url = "https://vardictrust.readthedocs.io/"
repo_url = "https://github.com/palakpsheth/VarDictRust"
repo_name = "palakpsheth/VarDictRust"
copyright = "Copyright &copy; 2026 Palak Sheth"
docs_dir = ".docs_staged"
site_dir = "site"

extra_javascript = [
  "javascripts/mathjax.js",
  "https://unpkg.com/mathjax@3.2.2/es5/tex-mml-chtml.js",
]

not_in_nav = """
benchmarks/gcp-prereg.md
docs/validation/gcp-study-protocol.md
docs/validation/scale-recalibration-proposal.md
docs/validation/provenance/task-*.md
paper/tables/*.md
"""

nav = [
  { "Overview" = "README.md" },
  { "Migration Guide" = "docs/migration.md" },
  { "Empirical Validation" = [
    { "Benchmark Ledger" = "benchmarks/README.md" },
    { "HG008 V0.4 Data Guide" = "benchmarks/hg008-v04-guide.md" },
    { "Omnibus Empirical Validation" = "docs/validation/omnibus-empirical-validation.md" },
    { "92-Chromosome Parity Suite (v1.0.7)" = "docs/validation/chr-parity-v107.md" },
  ] },
  { "Evaluation Manuscript" = [
    { "Manuscript" = "paper/manuscript.md" },
    { "Supplement" = "paper/supplement.md" },
    { "Reproducibility Guide" = "paper/README.md" },
  ] },
  { "Architecture" = [
    { "Ecosystem Survey" = "docs/ecosystem-survey.md" },
    { "Divergences & Quirks" = "DIVERGENCES.md" },
    { "Upstream Bug Catalog" = "docs/upstream-bugs.md" },
    { "JVM JavaHashMap Emulation" = "crates/vardictrust-core/testdata/javamap/README.md" },
    { "JVM & R Kernel Oracles" = "fixtures/jvm-oracles/README.md" },
    { "Hostile CIGAR Robustness" = "fixtures/pr402/README.md" },
  ] },
  { "Testing & Verification" = [
    { "Test Matrix & CI Audit" = "docs/testing/test-matrix-and-ci-audit.md" },
    { "Test Harness Guide" = "harness/README.md" },
  ] },
  { "Governance & Community" = [
    { "Contributing Guide" = "CONTRIBUTING.md" },
    { "Pull Request Template" = "community/pull_request_template.md" },
    { "Universal Agent Contract" = "AGENTS.md" },
    { "Roadmap" = "ROADMAP.md" },
    { "Changelog" = "CHANGELOG.md" },
    { "Security Policy" = "community/SECURITY.md" },
    { "Code of Conduct" = "community/CODE_OF_CONDUCT.md" },
    { "Release v1.1.0 Certification" = "docs/release/v1.1.0-pr.md" },
    { "Release v1.0.10 Certification" = "docs/release/v1.0.10-pr.md" },
    { "Release v1.0.9 Certification" = "docs/release/v1.0.9-pr.md" },
    { "Release v1.0.8 Certification" = "docs/release/v1.0.8-pr.md" },
    { "Release v1.0.7 Certification" = "docs/release/v1.0.7-pr.md" },
    { "Release v1.0.6 Certification" = "docs/release/v1.0.6-pr.md" },
    { "Release v1.0.5 Certification" = "docs/release/v1.0.5-pr.md" },
    { "Release v1.0.4 Certification" = "docs/release/v1.0.4-pr.md" },
    { "Release v1.0.3 Certification" = "docs/release/v1.0.3-pr.md" },
    { "Release v1.0.1 Certification" = "docs/release/v1.0.1-pr.md" },
    { "Release v1.0.0 Certification" = "docs/release/v1.0.0-pr.md" },
  ] },
]

[project.validation]
invalid_links = true
invalid_link_anchors = true

[project.theme]
language = "en"
features = [
  "navigation.tabs",
  "navigation.sections",
  "navigation.top",
  "search.suggest",
  "search.highlight",
  "content.code.copy",
]

[[project.theme.palette]]
scheme = "default"
primary = "teal"
accent = "deep orange"
toggle.icon = "material/brightness-7"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
scheme = "slate"
primary = "teal"
accent = "deep orange"
toggle.icon = "material/brightness-4"
toggle.name = "Switch to light mode"

[project.markdown_extensions]
admonition = {}
attr_list = {}
md_in_html = {}
tables = {}
toc.permalink = true
pymdownx.arithmatex.generic = true
pymdownx.details = {}
pymdownx.highlight.anchor_linenums = true
pymdownx.highlight.line_spans = "__span"
pymdownx.highlight.pygments_lang_class = true
pymdownx.inlinehilite = {}
pymdownx.snippets = {}
pymdownx.superfences.custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]
pymdownx.tabbed.alternate_style = true
